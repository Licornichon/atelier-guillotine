name: Deploy

# Runs after a successful "Build" on master and deploys its dist/ artifact
# over SFTP to the OVH hosting.
#
# Required secrets: OVH_FTP_SERVER, OVH_FTP_USERNAME, OVH_FTP_PASSWORD

on:
  workflow_run:
    workflows: [Build]
    types: [completed]
    branches: [master]

permissions:
  actions: read

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      # Le mutualisé OVH ne supporte pas FTPS (« 500 This security scheme
      # is not implemented ») : on passe en SFTP (port 22) avec lftp.
      - name: Deploy to OVH (SFTP)
        env:
          SFTP_HOST: ${{ secrets.OVH_FTP_SERVER }}
          SFTP_USER: ${{ secrets.OVH_FTP_USERNAME }}
          LFTP_PASSWORD: ${{ secrets.OVH_FTP_PASSWORD }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp
          lftp --env-password -u "$SFTP_USER" "sftp://$SFTP_HOST" -e "
            set sftp:auto-confirm yes;
            mirror --reverse --verbose --parallel=4 dist/ www/;
            bye"
