name: Build & Deploy

# Builds on every push (catches errors on working branches);
# deploys over FTP to the OVH hosting from master only.
#
# Required secrets: OVH_FTP_SERVER, OVH_FTP_USERNAME, OVH_FTP_PASSWORD

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - run: npm ci

      - run: npm run build:prod

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          # dist/.htaccess (URLs sans .html) est un fichier caché :
          # upload-artifact l'ignore par défaut depuis la v4.4.
          include-hidden-files: true

  deploy:
    needs: build
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Deploy to OVH
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.OVH_FTP_SERVER }}
          username: ${{ secrets.OVH_FTP_USERNAME }}
          password: ${{ secrets.OVH_FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./dist/
          server-dir: ./www/
